[project]
name = "nfl-prediction-platform"
version = "0.1.0"
description = "Cost-optimized NFL prediction platform on Azure Databricks + Delta Lake + MLflow"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter; long notebook strings are fine

[tool.ruff.lint.per-file-ignores]
# CLI entrypoints set sys.path / stdout encoding before importing the package.
"scripts/*.py" = ["E402"]
